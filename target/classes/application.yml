spring:
  application:
    name: skanda-travels-backend
  datasource:
    url: jdbc:h2:mem:skanda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    include-message: always

skanda:
  jwt:
    secret: ${SKANDA_JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-for-production}
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO
