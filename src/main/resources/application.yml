spring:
  application:
    name: skanda-travels-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/skanda_travels
    username: postgres
    password: postgres123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

skanda:
  jwt:
    secret: ${SKANDA_JWT_SECRET:skanda-travels-local-dev-secret-key-minimum-256bits}
    expiration-ms: 86400000

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}

logging:
  level:
    org.springframework.security: INFO
